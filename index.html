<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

<body>
    <main> 
        <section id="login">
            <div id="imagem">
                
            </div> 
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            </div>

            <form action="login.php" method="post" autocomplete="on">
                <div class="campos"><span  class="material-symbols-outlined icon">person</span><input type="email" name="email" id="iemail" placeholder="seu e-mail" class="input" required maxlength="30">
                </div>

                <div class="campos"><span class="material-symbols-outlined icon">key</span> <input type="password" name="pass" id="ipass" class="input" placeholder="sua senha" required></div>
                <div><input type="submit" value="Entrar" id="entrar"></div>
                <div id="botao"><a href="" >Esqueci a senha</a><span class="material-symbols-outlined" id="icone-mail">mail</span></div>
            </form>
        </section>
    </main>
